<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080b12">
    <title>ICodeDevs Android Virtual</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main id="app">
      <div id="screen" aria-label="Layar Android virtual"></div>
      <div id="status" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="status-text">Menghubungkan ke Android...</span>
      </div>
      <div id="message" hidden>
        <p id="message-text">Menghubungkan ke Android...</p>
        <button id="reconnect" type="button">Hubungkan ulang</button>
      </div>
      <button id="fullscreen" type="button" aria-label="Layar penuh" title="Layar penuh">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/>
        </svg>
      </button>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
